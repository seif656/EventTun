
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=order-service
server.port=8083

# Arret gracieux
server.shutdown=graceful

# ==========================================
# BASE DE DONNEES - MariaDB (XAMPP)
# ==========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/orders_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# EUREKA CLIENT
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.metadata-map.version=1.0.0
eureka.instance.metadata-map.team=EventTun

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=@project.name@
info.app.version=@project.version@

# ==========================================
# LOGGING
# ==========================================
logging.level.tn.esprit.eventtun.order_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# OPENFEIGN - APACHE HTTP CLIENT 5
# ==========================================
spring.cloud.openfeign.httpclient.enabled=true
spring.cloud.openfeign.httpclient.hc5.enabled=true

logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.boot.autoconfigure.condition=DEBUG
# Payment Service (M4)
services.payment.url=http://localhost:8084
