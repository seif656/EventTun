# ==========================================
# APPLICATION
# ==========================================
spring.application.name=event-service
server.port=8082

# ==========================================
# MYSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/events_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA ET HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# GESTION DES ERREURS
# ==========================================
spring.mvc.problemdetails.enabled=true

# ==========================================
# EUREKA CLIENT
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Heartbeat et expiration
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# Verification de l'etat du microservice
eureka.client.healthcheck.enabled=true

# Metadonnees
eureka.instance.metadata-map.version=1.0.0
eureka.instance.metadata-map.environment=${APP_ENV:development}

# ==========================================
# GRACEFUL SHUTDOWN
# ==========================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=EventTun Event Service
info.app.description=Gestion des evenements, categories et reservations
info.app.version=1.0.0
info.app.environment=${APP_ENV:development}

# ==========================================
# SWAGGER
# ==========================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi/event-service.yaml
springdoc.swagger-ui.disable-swagger-default-url=true