spring.application.name=payment-service
server.port=8084

# --- Base MySQL payments_db (XAMPP : root, sans mot de passe) ---
spring.datasource.url=jdbc:mysql://localhost:3306/payments_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# --- Erreurs au format Problem Details (application/problem+json) ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
# --- Simulation du paiement ---
# Au-delà de ce montant, le paiement simulé est refusé (FAILED -> 409)
payment.simulation.max-amount=500
