
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=order-service
server.port=8083

# ==========================================
# DATABASE CONFIGURATION - MariaDB (XAMPP)
# ==========================================

spring.datasource.url=jdbc:mariadb://localhost:3306/orders_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SWAGGER / OPENAPI CONFIGURATION
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==========================================
# MICROSERVICES CONFIGURATION (WITHOUT EUREKA)
# ==========================================

services.user.url=http://localhost:8081
services.event.url=http://localhost:8082
services.payment.url=http://localhost:8084
services.ticket.url=http://localhost:8085

# ==========================================
# LOGGING
# ==========================================

logging.level.tn.esprit.eventtun.order_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.open-in-view=false
# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Instance Configuration
eureka.instance.prefer-ip-address=true
