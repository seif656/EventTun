# ---- Ticket Service (M5) ----
spring.application.name=ticket-service
server.port=8085

# ---- MongoDB (base independante : tickets_db) ----
# Pour changer l'adresse sans modifier ce fichier : variable d'environnement MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tickets_db}
# Index unique sur uniqueCode : mettre MONGO_AUTO_INDEX=true quand MongoDB est lance.
# Par defaut false pour que l'application demarre meme sans MongoDB (validation 1).
spring.data.mongodb.auto-index-creation=${MONGO_AUTO_INDEX:false}

# ---- Swagger / OpenAPI ----
# Swagger UI : http://localhost:8085/swagger-ui/index.html
# Contrat JSON : http://localhost:8085/v3/api-docs
springdoc.api-docs.path=/v3/api-docs

# ---- Actuator (health) ----
management.endpoints.web.exposure.include=health,info
