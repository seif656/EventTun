server:
  port: 8761
  shutdown: graceful

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

info:
  app:
    name: EventTun Discovery Service
    description: Serveur central de decouverte des microservices
    version: 1.0.0
