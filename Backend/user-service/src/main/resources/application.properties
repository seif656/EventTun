spring.application.name=user-service
server.port=8081

# Local MySQL / XAMPP. Override credentials with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/users_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Keep existing data between application restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info,metrics

# Eureka service discovery - Chapter 4
server.shutdown=graceful
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
