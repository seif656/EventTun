spring.application.name=payment-service
server.port=8084

# --- Base locale H2 (démarrage sans MySQL) ---
spring.datasource.url=jdbc:h2:mem:payments_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Base cible MySQL (à activer plus tard) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/payments_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=update

# --- Erreurs au format Problem Details (application/problem+json) ---
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
